<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business News Update</title>
    <style>
        body { background-color: #0b1320; color: #ffffff; font-family: sans-serif; padding: 20px; }
        .card { background: #111b2d; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #1e2d4a; }
        .title { color: #38bdf8; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 5px; }
        
        /* Gaya Tautan Berita yang Bisa Diklik */
        .news-item { display: block; padding: 10px 0; border-bottom: 1px solid #1e2d4a; text-decoration: none; color: #ffffff; cursor: pointer; transition: 0.2s; }
        .news-item:hover { background: #1e2d4a; padding-left: 5px; color: #38bdf8; }
        .news-title { font-size: 14px; font-weight: 500; }
        .news-source { font-size: 11px; color: #64748b; margin-top: 2px; }
        
        video { width: 100%; border-radius: 8px; background: #000; }
    </style>
    <!-- Library Pemutar Video M3U8 Ringan -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <!-- KARTU 1: LATEST NEWS (Bisa Diklik) -->
    <div class="card">
        <div class="title">🌐 Latest Business News</div>
        <div id="news-container">
            <!-- Tautan berita otomatis muncul di sini via JavaScript -->
            <p style="color:#64748b; font-size:12px;">Memuat berita terbaru...</p>
        </div>
    </div>

    <!-- KARTU 2: LIVE STREAM PLAYER -->
    <div class="card">
        <div class="title">📺 Live Stream</div>
        <video id="video-player" controls autoplay muted></video>
    </div>

    <script>
        // 1. DAFTAR SUMBER STREAMING BERITA BISNIS (Format M3U8 Ringan)
        const newsStreams = {
            "Bloomberg": "https://fastly.net",
            "Reuters": "https://wurl.tv",
            "CNA_Business": "https://amagi.tv"
        };

        // 2. DATA BERITA TEKS YANG BISA DIKLIK (Bisa diganti dengan Fetch API RSS Feed)
        const dummyNewsData = [
            { title: "Tech Stocks Rally on Strong Earnings", source: "Bloomberg", streamKey: "Bloomberg" },
            { title: "Global Market Braces for Inflation Report", source: "Reuters", streamKey: "Reuters" },
            { title: "Asia Business Outlook Shows Growth Momentum", source: "CNA_Business", streamKey: "CNA_Business" }
        ];

        const newsContainer = document.getElementById('news-container');
        const video = document.getElementById('video-player');
        let hls = new Hls();

        // 3. FUNGSI UNTUK MERENDER BERITA AGAR BISA DIKLIK
        function renderNews() {
            newsContainer.innerHTML = ""; // Bersihkan teks memuat
            
            dummyNewsData.forEach(item => {
                // Membuat elemen tautan <a> yang bisa diklik
                const newsAnchor = document.createElement('a');
                newsAnchor.className = 'news-item';
                
                newsAnchor.innerHTML = `
                    <div class="news-title">${item.title}</div>
                    <div class="news-source">${item.source}</div>
                `;

                // Aksi ketika berita diklik: Mengubah sumber video live stream di bawahnya
                newsAnchor.onclick = function(e) {
                    e.preventDefault();
                    playStream(newsStreams[item.streamKey]);
                };

                newsContainer.appendChild(newsAnchor);
            });
        }

        // 4. FUNGSI MEMUTAR LIVE STREAM VIDEO (.M3U8)
        function playStream(url) {
            if (Hls.isSupported()) {
                hls.destroy(); // Reset player sebelumnya
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play(); });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.play();
            }
        }

        // Jalankan fungsi saat halaman web dibuka
        renderNews();
        playStream(newsStreams["Bloomberg"]); // Putar Bloomberg sebagai default
    </script>
</body>
</html>
