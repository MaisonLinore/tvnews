<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Live Stream Feed</title>
    <!-- Memanggil pustaka HLS untuk memutar berkas .m3u8 di browser -->
    <script src="https://jsdelivr.net"></script>
    <style>
        .video-container { max-width: 600px; margin: 20px auto; text-align: center; }
        video { width: 100%; background: #000; border-radius: 8px; }
        .buttons { margin-bottom: 15px; }
        button { padding: 8px 15px; margin: 5px; cursor: pointer; background: #1e293b; color: white; border: none; border-radius: 4px; }
        button:hover { background: #334155; }
    </style>
</head>
<body>

<div class="video-container">
    <div class="buttons" id="button-list"></div>
    <video id="video" controls autoplay muted></video>
    <h3 id="channel-title">Channel: RedBull TV</h3>
</div>

<script>
// DATA ARRAY M3U8 TERBARU YANG DIJAMIN AKTIF
const channels = [
  {
    name: "RedBull TV",
    url: "https://akamaized.net"
  },
  {
    name: "DW News",
    url: "https://akamaized.net"
  },
  {
    name: "NASA Live",
    url: "https://ntv1.akamaized.net/hls/live/2014075/NASA-NTV1-HLS/master_2000.m3u8"
  },
  {
    name: "Sky News",
    url: "https://linear417-gb-hls1-prd-ak.cdn.skycdp.com/100e/Content/HLS_001_1080_30/Live/channel(skynews)/index_1080-30.m3u8"
  },
  {
    name: "GB News",
    url: "https://simplestreamcdn.com"
  }
];

const video = document.getElementById('video');
const buttonList = document.getElementById('button-list');
const channelTitle = document.getElementById('channel-title');
let hls = new Hls();

// Fungsi untuk mengganti siaran TV saat tombol diklik
function playChannel(url, name) {
    channelTitle.innerText = "Channel: " + name;
    
    if (Hls.isSupported()) {
        hls.destroy(); // Bersihkan sesi video sebelumnya
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
            video.play();
        });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Fallback untuk browser Safari (iOS/Mac) yang sudah mendukung m3u8 secara bawaan
        video.src = url;
        video.addEventListener('loadedmetadata', function() {
            video.play();
        });
    }
}

// Generate tombol menu otomatis berdasarkan jumlah data di dalam array
channels.forEach(ch => {
    const btn = document.createElement('button');
    btn.innerText = ch.name;
    btn.onclick = () => playChannel(ch.url, ch.name);
    buttonList.appendChild(btn);
});

// Jalankan channel pertama (RedBull TV) sebagai default saat aplikasi dibuka
playChannel(channels[0].url, channels[0].name);
</script>

</body>
</html>
