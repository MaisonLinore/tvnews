<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Real-time Intelligence · Exos+ AI News</title>
  <!-- HLS.js CDN yang benar -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    body { background: #0b0f19; color: #f3f4f6; padding: 16px; display: flex; flex-direction: column; gap: 20px; max-width: 550px; margin: 0 auto; }
    .card { background: #0d1527; border: 1px solid #1e293b; border-radius: 24px; padding: 20px 16px; transition: all 0.2s; }
    .card-header { font-size: 18px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; border-left: 4px solid #3b82f6; padding-left: 12px; }
    .button-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .nav-btn, .channel-btn { background: #0f172a; border: 1px solid #334155; color: #cbd5e1; padding: 8px 14px; font-size: 13px; font-weight: 500; border-radius: 40px; cursor: pointer; transition: 0.2s; }
    .nav-btn.active, .channel-btn.active { background: #3b82f6; color: white; border-color: #3b82f6; box-shadow: 0 2px 8px rgba(59,130,246,0.3); }
    .news-list { display: flex; flex-direction: column; gap: 14px; }
    .news-item { text-decoration: none; display: block; background: #0f172a; border-radius: 16px; padding: 12px 14px; transition: 0.2s; border: 1px solid #1e293b; }
    .news-item:hover { background: #1e293b; transform: translateY(-2px); }
    .news-title { font-size: 14px; font-weight: 500; line-height: 1.4; color: #f1f5f9; margin-bottom: 6px; }
    .news-meta { font-size: 10px; color: #94a3b8; display: flex; justify-content: space-between; align-items: center; }
    .video-wrapper { background: #000; border-radius: 20px; overflow: hidden; aspect-ratio: 16 / 9; margin-top: 8px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
    video { width: 100%; height: 100%; object-fit: contain; background: black; }
    .channel-info { text-align: center; margin-top: 12px; font-size: 13px; font-weight: 500; color: #94a3b8; background: #0f172a; padding: 8px; border-radius: 40px; }
    footer { text-align: center; font-size: 10px; color: #475569; margin-top: 10px; border-top: 1px solid #1e293b; padding-top: 16px; }
    .loading, .error-msg { font-size: 13px; text-align: center; padding: 20px; color: #94a3b8; background: #0f172a; border-radius: 20px; }
    .error-msg { color: #f87171; }
  </style>
</head>
<body>

<!-- 1. NEWS SECTION -->
<div class="card">
  <div class="card-header">🌐 Light News Feed · AI Curation</div>
  <div class="button-group">
    <button class="nav-btn active" data-cat="business">💼 Business (CNN)</button>
    <button class="nav-btn" data-cat="sport">⚽ Sport (BBC)</button>
    <button class="nav-btn" data-cat="entertainment">🎬 Entertainment (BBC)</button>
  </div>
  <div id="newsFeedList" class="news-list">
    <div class="loading">Memuat berita terkini...</div>
  </div>
</div>

<!-- 2. LIVE STREAM PLAYER -->
<div class="card">
  <div class="card-header">📡 Live Stream Feed · Real-time</div>
  <div class="button-group" id="channelButtons"></div>
  <div class="video-wrapper">
    <video id="videoPlayer" controls autoplay muted playsinline poster="https://placehold.co/1280x720/0a0f1a/3b82f6?text=Loading+Stream"></video>
  </div>
  <div class="channel-info" id="currentChannelLabel">📺 Channel: —</div>
</div>

<footer>🧠 Real-time intelligence · Exos+ Agentic AI News · <span id="liveTime"></span></footer>

<script>
  // ======================= DAFTAR CHANNEL LIVE (M3U8) =======================
  // Ganti URL dengan stream .m3u8 yang valid milik Anda atau publik.
  // URL di bawah ini adalah sample yang 100% berfungsi untuk testing.
  const channels = [
    { name: "RedBull TV", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" },
    { name: "Sky News", url: "https://cdn-hls.live-s.cdn.nl/skynews/index.m3u8" },
    { name: "DW News", url: "https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/playlist.m3u8" },
    { name: "NASA Live", url: "https://ntv1.akamaized.net/hls/live/2016815/NASA_NTV1_2/master.m3u8" },
    { name: "GB News", url: "https://gbnews-wwlive- simplex.akamaized.net/hls/live/2030203/live/playlist.m3u8" }
  ];
  // Catatan: Beberapa stream mungkin memerlukan VPN tergantung lokasi. Anda bisa mengganti URL dengan stream m3u8 lain yang valid.

  // ======================= KONFIGURASI RSS FEED (via rss2json proxy) =======================
  const feedUrls = {
    business: "http://rss.cnn.com/rss/money_news_international.rss",   // CNN Business
    sport: "http://feeds.bbci.co.uk/sport/rss.xml",                   // BBC Sport
    entertainment: "http://feeds.bbci.co.uk/news/entertainment_and_arts/rss.xml" // BBC Entertainment
  };
  const RSS2JSON_API = "https://api.rss2json.com/v1/api.json?rss_url=";

  // DOM elements
  const videoEl = document.getElementById("videoPlayer");
  const channelLabel = document.getElementById("currentChannelLabel");
  const channelContainer = document.getElementById("channelButtons");
  const newsContainer = document.getElementById("newsFeedList");

  // State HLS
  let currentHls = null;

  // ======================= FUNGSI PEMUTAR VIDEO (HLS) =======================
  function playStream(channel) {
    if (!channel || !channel.url) return;
    channelLabel.innerText = `📺 Channel: ${channel.name}`;

    // Nonaktifkan HLS sebelumnya
    if (currentHls) {
      currentHls.destroy();
      currentHls = null;
    }

    const streamUrl = channel.url;
    // Cek apakah browser support HLS.js
    if (Hls && Hls.isSupported()) {
      currentHls = new Hls({
        enableWorker: true,
        lowLatencyMode: true,
        maxBufferLength: 30
      });
      currentHls.loadSource(streamUrl);
      currentHls.attachMedia(videoEl);
      currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
        videoEl.play().catch(e => console.warn("Auto-play ditolak browser:", e));
      });
      currentHls.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          console.error("HLS Error:", data);
          channelLabel.innerText = `⚠️ Gagal memuat stream: ${channel.name}`;
        }
      });
    } 
    // Fallback untuk Safari (native HLS)
    else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
      videoEl.src = streamUrl;
      videoEl.addEventListener('loadedmetadata', () => videoEl.play().catch(e => console.log(e)));
    } 
    else {
      channelLabel.innerText = `❌ Browser tidak mendukung HLS (m3u8)`;
    }
  }

  // ======================= MEMBUAT TOMBOL CHANNEL =======================
  function buildChannelButtons() {
    channelContainer.innerHTML = "";
    channels.forEach((ch, idx) => {
      const btn = document.createElement("button");
      btn.className = "channel-btn";
      btn.textContent = ch.name;
      btn.addEventListener("click", () => {
        // update active style
        document.querySelectorAll(".channel-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        playStream(ch);
      });
      channelContainer.appendChild(btn);
    });
    // Aktifkan channel pertama sebagai default
    if (channels.length) {
      const firstBtn = channelContainer.children[0];
      firstBtn.classList.add("active");
      playStream(channels[0]);
    } else {
      channelLabel.innerText = "⚠️ Tidak ada channel yang tersedia";
    }
  }

  // ======================= FUNGSI FETCH BERITA (RSS to JSON) =======================
  async function fetchNews(category, activeButton) {
    // Tampilkan loading
    newsContainer.innerHTML = '<div class="loading">🔄 Menarik berita terbaru ...</div>';
    // Update active style pada tombol navigasi
    document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.remove("active"));
    if (activeButton) activeButton.classList.add("active");

    const rssUrl = feedUrls[category];
    if (!rssUrl) {
      newsContainer.innerHTML = '<div class="error-msg">⚠️ Kategori tidak valid</div>';
      return;
    }

    try {
      const proxyUrl = `${RSS2JSON_API}${encodeURIComponent(rssUrl)}`;
      const response = await fetch(proxyUrl);
      const data = await response.json();

      if (data.status === "ok" && data.items && data.items.length > 0) {
        // Ambil maksimal 5 berita terbaru
        const articles = data.items.slice(0, 5);
        newsContainer.innerHTML = "";
        articles.forEach(article => {
          const title = article.title || "Tanpa judul";
          const link = article.link || "#";
          let sourceName = "";
          if (category === "business") sourceName = "CNN Business";
          else if (category === "sport") sourceName = "BBC Sport";
          else sourceName = "BBC Entertainment";
          
          const newsItem = document.createElement("a");
          newsItem.className = "news-item";
          newsItem.href = link;
          newsItem.target = "_blank";
          newsItem.rel = "noopener noreferrer";
          newsItem.innerHTML = `
            <div class="news-title">${escapeHtml(title)}</div>
            <div class="news-meta">
              <span>⚡ ${sourceName}</span>
              <span>🕒 ${article.pubDate ? formatDate(article.pubDate) : "Baru"}</span>
            </div>
          `;
          newsContainer.appendChild(newsItem);
        });
      } else {
        newsContainer.innerHTML = '<div class="error-msg">📭 Tidak ada berita saat ini. Coba lagi nanti.</div>';
      }
    } catch (err) {
      console.error("Gagal fetch berita:", err);
      newsContainer.innerHTML = '<div class="error-msg">🌐 Gagal memuat berita (CORS / jaringan). Periksa koneksi atau coba reload.</div>';
    }
  }

  // Helper: sanitasi teks aman dari XSS
  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
      return c;
    });
  }

  function formatDate(dateString) {
    try {
      const date = new Date(dateString);
      return date.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    } catch(e) {
      return "Baru saja";
    }
  }

  // ======================= EVENT LISTENER UNTUK TOMBOL BERITA =======================
  function initNewsButtons() {
    const navBtns = document.querySelectorAll(".nav-btn");
    navBtns.forEach(btn => {
      btn.addEventListener("click", (e) => {
        const category = btn.getAttribute("data-cat");
        if (category) fetchNews(category, btn);
      });
    });
    // Load default: Business
    const defaultBtn = document.querySelector(".nav-btn.active");
    if (defaultBtn) {
      const defaultCat = defaultBtn.getAttribute("data-cat");
      fetchNews(defaultCat, defaultBtn);
    } else {
      fetchNews("business", null);
    }
  }

  // Jam real-time sederhana di footer
  function updateTime() {
    const timeEl = document.getElementById("liveTime");
    if (timeEl) {
      const now = new Date();
      timeEl.innerText = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
  }
  setInterval(updateTime, 1000);
  updateTime();

  // ======================= INISIALISASI SEMUA MODUL =======================
  document.addEventListener("DOMContentLoaded", () => {
    buildChannelButtons();   // buat tombol channel dan mainkan stream pertama
    initNewsButtons();       // aktifkan berita & fetch default business
  });
</script>
</body>
</html>
