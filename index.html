<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-time Intelligence & Stream Feed</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 500px;
      margin: 0 auto;
    }

    /* CONTAINER 1: LIVE NEWS */
    .news-container {
      background-color: #0d1527;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 16px;
    }

    .news-header {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
    }

    .news-header::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 16px;
      background-color: #3b82f6;
      border-radius: 2px;
      margin-right: 8px;
    }

    .news-nav {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }

    .nav-btn {
      background: #0f172a;
      border: 1px solid #1e293b;
      color: #9ca3af;
      padding: 6px 10px;
      font-size: 11px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    .nav-btn.active {
      background: #3b82f6;
      color: #ffffff;
      border-color: #3b82f6;
    }

    .news-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .news-item {
      text-decoration: none;
      color: inherit;
      display: block;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
    }

    .news-title {
      font-size: 13.5px;
      line-height: 1.4;
      margin-bottom: 5px;
      color: #e5e7eb;
      font-weight: 500;
    }

    .news-meta {
      font-size: 10.5px;
      color: #9ca3af;
      display: flex;
      justify-content: space-between;
    }

    /* CONTAINER 2: LIVE STREAM PLAYER */
    .stream-container {
      background-color: #0d1527;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 16px;
    }

    .stream-header {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
    }

    .stream-header::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 16px;
      background-color: #3b82f6;
      border-radius: 2px;
      margin-right: 8px;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .channel-btn {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      color: #9ca3af;
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .channel-btn.active {
      background-color: #1e3a8a;
      border-color: #3b82f6;
      color: #ffffff;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      background-color: #000000;
      border-radius: 12px;
      overflow: hidden;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .channel-info {
      text-align: center;
      font-size: 11px;
      color: #9ca3af;
      margin-top: 10px;
    }

    footer {
      text-align: center;
      font-size: 11px;
      color: #6b7280;
      margin-top: 5px;
    }

    .loading-text {
      font-size: 12px;
      color: #9ca3af;
      text-align: center;
      padding: 15px 0;
    }
  </style>
</head>
<body>

  <!-- LIVE NEWS MODULE -->
  <div class="news-container">
    <div class="news-header">🌐 Light News Feed</div>
    
    <div class="news-nav">
      <button class="nav-btn active" onclick="fetchLiveNews('business', this)">💼 Business (CNN)</button>
      <button class="nav-btn" onclick="fetchLiveNews('sport', this)">⚽ Sport (BBC)</button>
      <button class="nav-btn" onclick="fetchLiveNews('entertainment', this)">🎬 Entertainment (BBC)</button>
    </div>

    <div id="newsFeedList" class="news-list">
      <div class="loading-text">Loading world news headlines...</div>
    </div>
  </div>

  <!-- LIVE VIDEO MODULE -->
  <div class="stream-container">
    <div class="stream-header">📺 Live Stream Feed</div>
    <div class="button-group" id="channelButtons"></div>
    <div class="video-wrapper">
      <!-- Menggunakan Sandbox agar aman dan lolos dari proteksi Github -->
      <iframe id="videoPlayer" src="" sandbox="allow-scripts allow-same-origin allow-popups" allowfullscreen></iframe>
    </div>
    <div class="channel-info" id="currentChannelLabel">Channel: Initializing...</div>
  </div>

  <footer>Real-time intelligence · Exos+ Agentic AI News</footer>

  <script>
    // 1. LINK EMBED TERBARU YANG DIIZINKAN DI WEB UTK GLOBAL AUDIENCE
    const channels = [
      { name: "RedBull TV", url: "https://youtube.com" },
      { name: "DW News", url: "https://youtube.com" },
      { name: "NASA Live", url: "https://youtube.com" },
      { name: "Sky News", url: "https://youtube.com" },
      { name: "GB News", url: "https://youtube.com" }
    ];

    const buttonGroup = document.getElementById("channelButtons");
    const videoPlayer = document.getElementById("videoPlayer");
    const channelLabel = document.getElementById("currentChannelLabel");

    function updateActiveChannel(index, element) {
      videoPlayer.src = channels[index].url;
      channelLabel.innerText = "Channel: " + channels[index].name;
      const allButtons = document.querySelectorAll(".channel-btn");
      allButtons.forEach(btn => btn.classList.remove("active"));
      element.classList.add("active");
    }

    channels.forEach((ch, index) => {
      const btn = document.createElement("button");
      btn.className = "channel-btn";
      btn.innerText = ch.name;
      btn.onclick = function() { updateActiveChannel(index, btn); };
      buttonGroup.appendChild(btn);
    });

    // Jalankan DW News (Index 1) sebagai awal karena linknya paling kuat menembus CORS
    updateActiveChannel(1, buttonGroup.children[1]);

    // 2. REAL-TIME NEWS FETCH ENGINE DENGAN BYPASS CORS BY ALLORIGINS
    const networkFeeds = {
      business: "http://cnn.com",
      sport: "https://bbci.co.uk",
      entertainment: "https://bbci.co.uk"
    };

    async function fetchLiveNews(category, element) {
      const displayContainer = document.getElementById("newsFeedList");
      displayContainer.innerHTML = '<div class="loading-text">Fetching live worldwide headlines...</div>';
      
      const filterButtons = document.querySelectorAll(".nav-btn");
      filterButtons.forEach(btn => btn.classList.remove("active"));
      element.classList.add("active");

      try {
        const targetRss = networkFeeds[category];
        // Memakai open proxy AllOrigins agar lolos dari pemblokiran CORS GitHub Pages
        const response = await fetch(`https://allorigins.win{encodeURIComponent(targetRss)}`);
        const json = await response.json();
        
        // Mengubah string XML RSS menjadi objek data read-ready
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(json.contents, "text/xml");
        const items = xmlDoc.getElementsByTagName("item");

        if (items.length > 0) {
          displayContainer.innerHTML = "";
          
          // Ambil 3 berita teratas yang paling baru
          for (let i = 0; i < 3; i++) {
            if(!items[i]) break;
            
            const title = items[i].getElementsByTagName("title")[0].textContent;
            const link = items[i].getElementsByTagName("link")[0].textContent;
            
            let branding = "BBC News";
            if (category === 'business') branding = "CNN Business";

            const markup = `
              <a href="${link}" target="_blank" class="news-item">
                <div class="news-title">${title}</div>
                <div class="news-meta">
                  <span>⚡ ${branding}</span>
                  <span>🕒 Live updated</span>
                </div>
              </a>
            `;
            displayContainer.innerHTML += markup;
          }
        } else {
          displayContainer.innerHTML = '<div class="loading-text">No active feeds found.</div>';
        }
      } catch (err) {
        displayContainer.innerHTML = '<div class="loading-text">Network Error: Please reload the page.</div>';
      }
    }

    // Ambil berita pertama saat web selesai dimuat
    document.addEventListener("DOMContentLoaded", () => {
      const defaultSelector = document.querySelector(".nav-btn");
      fetchLiveNews('business', defaultSelector);
    });
  </script>

</body>
</html>
