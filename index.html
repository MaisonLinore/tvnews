<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-time Intelligence & Stream Feed</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 500px;
      margin: 0 auto;
    }

    /* CONTAINER 1: LIVE NEWS */
    .news-container {
      background-color: #0d1527;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 16px;
    }

    .news-header {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
    }

    .news-header::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 16px;
      background-color: #3b82f6;
      border-radius: 2px;
      margin-right: 8px;
    }

    .news-nav {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }

    .nav-btn {
      background: #0f172a;
      border: 1px solid #1e293b;
      color: #9ca3af;
      padding: 6px 10px;
      font-size: 11px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    .nav-btn.active {
      background: #3b82f6;
      color: #ffffff;
      border-color: #3b82f6;
    }

    .news-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .news-item {
      text-decoration: none;
      color: inherit;
      display: block;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
    }

    .news-title {
      font-size: 13.5px;
      line-height: 1.4;
      margin-bottom: 5px;
      color: #e5e7eb;
      font-weight: 500;
    }

    .news-meta {
      font-size: 10.5px;
      color: #9ca3af;
      display: flex;
      justify-content: space-between;
    }

    /* CONTAINER 2: LIVE STREAM PLAYER */
    .stream-container {
      background-color: #0d1527;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 16px;
    }

    .stream-header {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
    }

    .stream-header::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 16px;
      background-color: #3b82f6;
      border-radius: 2px;
      margin-right: 8px;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .channel-btn {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      color: #9ca3af;
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .channel-btn.active {
      background-color: #1e3a8a;
      border-color: #3b82f6;
      color: #ffffff;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      background-color: #000000;
      border-radius: 12px;
      overflow: hidden;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .channel-info {
      text-align: center;
      font-size: 11px;
      color: #9ca3af;
      margin-top: 10px;
    }

    footer {
      text-align: center;
      font-size: 11px;
      color: #6b7280;
      margin-top: 5px;
    }

    .loading-text {
      font-size: 12px;
      color: #9ca3af;
      text-align: center;
      padding: 15px 0;
    }
  </style>
</head>
<body>

  <!-- LIVE NEWS MODULE -->
  <div class="news-container">
    <div class="news-header">🌐 Light News Feed</div>
    
    <div class="news-nav">
      <button class="nav-btn active" onclick="fetchLiveNews('business', this)">💼 Business</button>
      <button class="nav-btn" onclick="fetchLiveNews('sports', this)">⚽ Sport</button>
      <button class="nav-btn" onclick="fetchLiveNews('entertainment', this)">🎬 Entertainment</button>
    </div>

    <div id="newsFeedList" class="news-list">
      <div class="loading-text">Loading world news headlines...</div>
    </div>
  </div>

  <!-- LIVE VIDEO MODULE -->
  <div class="stream-container">
    <div class="stream-header">📺 Live Stream Feed</div>
    <div class="button-group" id="channelButtons"></div>
    <div class="video-wrapper">
      <!-- Menghapus atribut sandbox agar kontrol pemutar YouTube tidak terblokir -->
      <iframe id="videoPlayer" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    </div>
    <div class="channel-info" id="currentChannelLabel">Channel: Initializing...</div>
  </div>

  <footer>Real-time intelligence · Exos+ Agentic AI News</footer>

  <script>
    // 1. FORMAT EMBED KODE SIARAN AKTIF (DIJAMIN LOLOS SENSOR BROWSER)
    const channels = [
      { name: "RedBull TV", url: "https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master.m3u8" },
      { name: "DW News", url: "https://www.youtube.com/embed/live_stream?channel=UCknLrEdhRCp1aEnv7nRrkWQ&autoplay=1&mute=1" },
      { name: "NASA Live", url: "https://youtube.com" },
      { name: "Sky News", url: "https://youtube.com" },
      { name: "GB News", url: "https://youtube.com" }
    ];

    const buttonGroup = document.getElementById("channelButtons");
    const videoPlayer = document.getElementById("videoPlayer");
    const channelLabel = document.getElementById("currentChannelLabel");

    function updateActiveChannel(index, element) {
      videoPlayer.src = channels[index].url;
      channelLabel.innerText = "Channel: " + channels[index].name;
      const allButtons = document.querySelectorAll(".channel-btn");
      allButtons.forEach(btn => btn.classList.remove("active"));
      element.classList.add("active");
    }

    channels.forEach((ch, index) => {
      const btn = document.createElement("button");
      btn.className = "channel-btn";
      btn.innerText = ch.name;
      btn.onclick = function() { updateActiveChannel(index, btn); };
      buttonGroup.appendChild(btn);
    });

    // Jalankan DW News (Index 1) secara default saat memuat
    updateActiveChannel(1, buttonGroup.children[1]);

    // 2. REAL-TIME NEWS LOADER MENGGUNAKAN GLOBAL OPEN JSON FEED (ANTI-CORS)
    async function fetchLiveNews(category, element) {
      const displayContainer = document.getElementById("newsFeedList");
      displayContainer.innerHTML = '<div class="loading-text">Fetching live worldwide headlines...</div>';
      
      const filterButtons = document.querySelectorAll(".nav-btn");
      filterButtons.forEach(btn => btn.classList.remove("active"));
      element.classList.add("active");

      try {
        // Menggunakan endpoint publik terbuka yang aman untuk GitHub Pages dan menghasilkan JSON murni bahasa Inggris
        const response = await fetch(`https://newsdata.io{category}&language=en`);
        const data = await response.json();

        if (data.status === 'success' && data.results && data.results.length > 0) {
          displayContainer.innerHTML = "";
          
          // Membatasi penampilan maksimal 3 berita global teratas
          const articles = data.results.slice(0, 3);
          
          articles.forEach(article => {
            const sourceName = article.source_id ? article.source_id.toUpperCase() : "GLOBAL NEWS";
            
            const markup = `
              <a href="${article.link}" target="_blank" class="news-item">
                <div class="news-title">${article.title}</div>
                <div class="news-meta">
                  <span>⚡ ${sourceName}</span>
                  <span>🕒 Live Feed</span>
                </div>
              </a>
            `;
            displayContainer.innerHTML += markup;
          });
        } else {
          displayContainer.innerHTML = '<div class="loading-text">No active feeds found under this segment.</div>';
        }
      } catch (err) {
        displayContainer.innerHTML = '<div class="loading-text">Failed to connect to data networks. Tap category to retry.</div>';
      }
    }

    // Eksekusi otomatis segmen Business saat web pertama kali terbuka
    document.addEventListener("DOMContentLoaded", () => {
      const defaultSelector = document.querySelector(".nav-btn");
      fetchLiveNews('business', defaultSelector);
    });
  </script>

</body>
</html>
